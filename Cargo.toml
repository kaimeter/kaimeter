[package]
name = "kaimeter-core"
version = "0.2.0"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
description = "Kaimeter: open-core CBAM compliance toolkit (core server)"
repository = "https://github.com/kaimeter/kaimeter"
readme = "README.md"
publish = false
# One binary: the server. The frontend is built by build.rs, not by a bin.
default-run = "kaimeter"

# The product is named kaimeter (README, systemd unit, container entrypoint);
# only the package/crate carries the -core suffix.
[[bin]]
name = "kaimeter"
path = "src/main.rs"

[features]
# Generates the TypeScript wire contract from the API's own request/response
# types (`cargo test --features ts`, written to web/.generated/). Off by default
# so the shipped binary — and its SBOM — carry no typegen dependency. The
# frontend typecheck consumes the generated files; see web/jsconfig.json.
ts = ["dep:ts-rs"]

[dependencies]
aes-gcm = "0.10.3"
anyhow = "1"
argon2 = "0.5.3"
axum = "0.8"
base64 = "0.23.1"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
hex = "0.4"
rand_core = { version = "0.6", features = ["getrandom"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
toml = "0.8"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Typegen only (feature `ts`): derives the frontend's declarations from these
# very structs, so the client cannot drift from the handlers.
ts-rs = { version = "9", optional = true, features = ["serde-json-impl"] }

[dev-dependencies]
http-body-util = "0.1"
# Parses the built wizard for the artifact-contract tests. Regex over a bundle
# is not enough: React's own source contains attribute-shaped string literals.
scraper = "0.24"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

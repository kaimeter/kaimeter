# Dependency policy enforced by `cargo deny check` in CI.

[graph]
# Audit every feature combination, not only default features.
all-features = true

[advisories]
unmaintained = "workspace"
unsound = "all"
ignore = []

[bans]
# Duplicates are reported for review; wildcard version requirements are banned.
multiple-versions = "warn"
wildcards = "deny"

[licenses]
# Permissive set only: the reference implementation is Apache-2.0 and must
# stay redistributable as a bundle.
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]

[sources]
# Only crates.io; git or vendored sources require an explicit review.
unknown-registry = "deny"
unknown-git = "deny"

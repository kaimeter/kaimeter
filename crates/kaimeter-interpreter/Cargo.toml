[package]
name = "kaimeter-interpreter"
description = "Fixed rule-bundle interpreter: arithmetic, canonical hashing and the rule schema of the CBAM methodology."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
publish = false

[lints]
workspace = true

[dependencies]
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
sha2 = { version = "0.10", default-features = false }

name: ci

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: kaimeter
  # The frontend toolchain. `cargo build` runs build.rs, which runs npm, so every
  # job that compiles the crate needs Node — and the npm cache, or the frontend
  # is reinstalled from scratch each time.
  NODE_VERSION: 22

jobs:
  fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  fmt-md:
    name: prettier --check (markdown)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: npx -y prettier@3.9.6 --check "**/*.md"

  spdx-headers:
    name: scripts/check-spdx.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: ./scripts/check-spdx.sh

  web:
    name: frontend build (vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web run build

  types:
    name: typescript contract + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      # `--features ts` derives web/.generated/*.ts from the API's own request
      # and response types (ts-rs); typecheck then holds the JS client to them.
      # Without this step the bindings do not exist and the client is unchecked.
      - run: cargo test --features ts --lib
      - run: npm --prefix web run typecheck

  clippy:
    name: cargo clippy -D warnings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cargo test --all-features --workspace

  build-release:
    name: cargo build --release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cargo build --release
      - name: Stage release artifacts
        run: |
          mkdir -p dist
          cp "target/release/${BINARY_NAME}" "dist/${BINARY_NAME}"
          cp deploy/kaimeter.service dist/
          cp Dockerfile dist/
      - uses: actions/upload-artifact@v6
        with:
          name: release-binary
          path: dist/
          if-no-files-found: error

  sign-release:
    name: cosign keyless sign + SBOM provenance
    needs: [build-release]
    if: github.event_name == 'release'
    permissions:
      # Upload the signed artifacts to the release (assets).
      contents: write
      # Required for cosign keyless signing via GitHub OIDC (Fulcio/Rekor).
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: release-binary
          path: dist

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0

      # SBOM for the release binary itself, written to the path
      # attest-blob expects. (sbom-action's `artifact-name` is the OUTPUT
      # file name and must not carry a directory prefix — hence scanning
      # directly instead of going through the action.)
      - name: Generate SBOM (syft)
        run: syft scan "dist/${BINARY_NAME}" -o "spdx-json=sbom-spdx.json"

      - name: Sign binary with cosign (keyless, OIDC)
        run: |
          cosign sign-blob \
            --yes \
            --bundle "dist/${BINARY_NAME}.bundle" \
            "dist/${BINARY_NAME}"

      - name: Attest SBOM provenance (keyless, OIDC)
        run: |
          cosign attest-blob \
            --yes \
            --predicate "sbom-spdx.json" \
            --type spdxjson \
            --bundle "dist/${BINARY_NAME}.sbom.attest.bundle" \
            "dist/${BINARY_NAME}"

      - name: Attach artifacts to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "dist/${BINARY_NAME}" \
            "dist/${BINARY_NAME}.bundle" \
            "dist/${BINARY_NAME}.sbom.attest.bundle" \
            "sbom-spdx.json" \
            --clobber

      - uses: actions/upload-artifact@v6
        with:
          name: signed-release
          path: |
            dist/${{ env.BINARY_NAME }}.bundle
            dist/${{ env.BINARY_NAME }}.sbom.attest.bundle
            sbom-spdx.json
          if-no-files-found: error

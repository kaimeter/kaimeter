<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kaimeter — CBAM Compliance Wizard</title>
<style>
/* Monochrome document design: paper, ink, rules. Headings set in a serif
   (Songti for zh), every figure in tabular monospace: the math must look
   auditable, because it is. The single deliberate hue is --ok, a muted
   institutional green reserved for verified/complete status. */
:root{
  --paper:#f9f8f5; --ink:#141414; --gray:#5a5751; --faint:#8a867e;
  --rule:#d9d6cf; --wash:#efede8; --card:#ffffff;
  --ok:#1f7a4d; --ok-wash:#e9f2ec;
  --serif:Georgia,"Times New Roman","Songti SC",SimSun,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans","PingFang SC","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Courier New","Noto Sans Mono CJK SC",monospace;
}
*{box-sizing:border-box; margin:0; padding:0}
body{
  background:var(--paper); color:var(--ink); min-height:100vh;
  font-family:var(--sans); font-size:15px; line-height:1.55;
}
.topbar{
  display:flex; align-items:center; gap:16px; padding:14px 22px;
  border-bottom:2px solid var(--ink); background:var(--paper);
  position:sticky; top:0; z-index:10;
}
.brand{font-family:var(--serif); font-weight:700; font-size:19px; letter-spacing:.2px}
.tabs{display:flex; gap:2px; margin-left:12px; flex:1}
.tab{
  background:none; border:none; color:var(--gray); font-size:14px; padding:8px 13px 6px;
  border-radius:0; cursor:pointer; font-family:inherit;
  border-bottom:2px solid transparent;
}
.tab:hover{color:var(--ink)}
.tab.active{color:var(--ink); border-bottom-color:var(--ink); font-weight:600}
.lang-select{
  background:var(--card); border:1px solid var(--rule); color:var(--ink);
  border-radius:2px; padding:5px 8px; font-size:12px; font-family:inherit; cursor:pointer;
}
.lang-select:hover{border-color:var(--ink)}
.role-btn{
  color:var(--gray); text-decoration:none; font-size:12px; padding:5px 10px;
  border:1px solid var(--rule); border-radius:2px; background:none; font-family:inherit; cursor:pointer;
}
.role-btn:hover{color:var(--ink); border-color:var(--ink)}
.role-btn .rname{color:var(--ink); font-weight:600}
.top-link{
  background:none; border:none; color:var(--gray); font-size:12px; padding:5px 2px;
  font-family:inherit; cursor:pointer; text-decoration:underline dotted; text-underline-offset:3px;
}
.top-link:hover{color:var(--ink)}
main{max-width:880px; margin:0 auto; padding:28px 22px 44px}
footer{
  max-width:880px; margin:0 auto; padding:18px 22px 40px; color:var(--faint);
  font-size:12px; border-top:1px solid var(--rule);
}
.view{display:none}
.view.active{display:block}

h2{font-family:var(--serif); font-size:22px; font-weight:700; margin-bottom:4px}
.sub{font-family:var(--serif); font-style:italic; color:var(--gray); font-size:14px; margin-bottom:8px}
.grid{display:grid; grid-template-columns:1fr 1fr; gap:0 28px}
.card{
  background:none; border:none; border-top:1px solid var(--rule);
  border-radius:0; padding:14px 0 4px; margin-top:22px;
}
.card h3{font-size:11px; text-transform:uppercase; letter-spacing:1.5px; color:var(--gray); font-weight:600; margin-bottom:10px}
/* Term tooltip: a small ? next to jargon. Text is set from the i18n layer
   at render time (data-tipkey -> data-tip), so it re-localizes on switch. */
.tip{
  display:inline-flex; align-items:center; justify-content:center;
  width:15px; height:15px; border:1px solid var(--faint); border-radius:50%;
  font-family:var(--serif); font-size:10px; font-weight:400; color:var(--gray);
  text-transform:none; letter-spacing:0; background:none; cursor:help;
  position:relative; vertical-align:1px; margin-left:6px; outline:none;
}
.tip:hover, .tip:focus{border-color:var(--ink); color:var(--ink)}
.tip::after{
  content:attr(data-tip); display:none; position:absolute;
  top:calc(100% + 8px); left:50%; transform:translateX(-50%);
  width:max-content; max-width:280px; background:var(--card);
  border:1px solid var(--ink); border-radius:2px; box-shadow:3px 3px 0 var(--wash);
  padding:8px 11px; font-family:var(--sans); font-size:12px; font-weight:400;
  line-height:1.55; color:var(--ink); text-align:left; text-transform:none; letter-spacing:0;
  white-space:normal; z-index:40; cursor:text;
}
.tip:hover::after, .tip:focus::after{display:block}
.card .big{font-family:var(--mono); font-size:30px; font-weight:700; font-variant-numeric:tabular-nums}
.card .big .unit{font-size:14px; color:var(--gray); font-weight:400; margin-left:4px}
.card .note{font-size:12px; color:var(--gray); margin-top:6px}
.accent{color:var(--ink); font-weight:600}
.warn{color:var(--ink); font-weight:600}
.bad{color:var(--ink); font-weight:700}
.good{color:var(--ok); font-weight:600}

.bar{height:14px; background:var(--card); border:1px solid var(--ink); border-radius:0; overflow:hidden; margin:10px 0 6px}
.bar .fill{height:100%; background:var(--ink); border-radius:0; transition:width .3s}
.bar .fill.over{background:repeating-linear-gradient(45deg, var(--ink) 0 3px, var(--card) 3px 7px)}
.bar .fill.near{background:var(--faint)}
.line50{display:flex; justify-content:space-between; font-size:12px; color:var(--gray)}

table{width:100%; border-collapse:collapse; font-size:14px}
th{text-align:left; color:var(--gray); font-size:10.5px; text-transform:uppercase; letter-spacing:1.5px; padding:8px 10px 6px; border-bottom:2px solid var(--ink)}
td{padding:9px 10px; border-bottom:1px solid var(--rule)}
tr:hover td{background:var(--wash)}
td:nth-child(1), td:nth-child(3), td:nth-child(4){font-family:var(--mono); font-variant-numeric:tabular-nums}
.stamp{
  display:inline-block; border:1px solid var(--ok); border-radius:2px; padding:2px 9px;
  font-size:10.5px; font-weight:600; letter-spacing:.08em; text-transform:uppercase;
  color:var(--ok); background:var(--ok-wash);
}
.pill{display:inline-block; font-size:11px; border-radius:2px; padding:2px 9px; border:1px solid var(--rule); color:var(--gray)}
.pill.ok{color:var(--ok); border-color:var(--ok); background:var(--ok-wash)}
.pill.warn{color:var(--gray); border:1px dashed var(--faint)}
@media (max-width:720px){
  .grid, .role-grid, .frow{grid-template-columns:1fr}
}

button.btn{
  background:var(--ink); color:var(--paper); border:1px solid var(--ink); border-radius:2px;
  padding:9px 18px; font-size:14px; font-weight:600; cursor:pointer; font-family:inherit;
}
button.btn:hover{background:#000}
button.btn.ghost{background:none; color:var(--gray); border:1px solid var(--rule)}
button.btn.ghost:hover{color:var(--ink); border-color:var(--ink); background:none}
button.btn:disabled{background:var(--wash); color:var(--faint); cursor:not-allowed; border:1px solid var(--rule)}

.modal-bg{position:fixed; inset:0; background:rgba(20,20,20,.5); display:none; z-index:20; overflow:auto}
.modal-bg.open{display:block}
.modal{
  background:var(--paper); border:1px solid var(--ink); border-radius:2px;
  max-width:720px; margin:40px auto; padding:24px;
}
.modal h2{font-size:19px}
.stepper{display:flex; gap:8px; margin:16px 0 22px}
.step{flex:1; text-align:center; font-size:12px; color:var(--faint); padding:8px 4px; border-bottom:2px solid var(--rule)}
.step.cur{color:var(--ink); border-color:var(--ink); font-weight:600}
.step.done{color:var(--gray); border-color:var(--gray)}

.fgroup{margin-bottom:16px}
.fgroup label{display:block; font-size:11px; text-transform:uppercase; letter-spacing:1.2px; color:var(--gray); margin-bottom:5px; font-weight:600}
.fgroup input[type=text], .fgroup input[type=number], .fgroup input[type=date], .fgroup select{
  width:100%; background:var(--card); border:1px solid var(--rule); color:var(--ink);
  border-radius:2px; padding:9px 11px; font-size:14px; font-family:inherit;
}
.fgroup input[type=number]{font-family:var(--mono); font-variant-numeric:tabular-nums}
.fgroup input:focus, .fgroup select:focus{outline:none; border-color:var(--ink)}
.frow{display:grid; grid-template-columns:1fr 1fr; gap:14px}

.docclass{
  border:1px solid var(--rule); border-radius:2px; padding:14px; margin-bottom:12px; background:var(--card);
}
.docclass h4{font-size:14px; margin-bottom:2px; font-family:var(--serif)}
.docclass .hint{font-size:12px; color:var(--gray); margin-bottom:8px}
.chips{display:flex; flex-wrap:wrap; gap:6px}
.chip{background:var(--wash); border:1px solid var(--rule); border-radius:2px; padding:3px 9px; font-size:12px}
.chip button{
  background:none; border:none; padding:0 0 0 6px; color:var(--faint);
  font-family:inherit; font-size:13px; line-height:1; cursor:pointer;
}
.chip button:hover{color:var(--ink)}
/* Hover a chip to inspect the file: raw contents + every extracted field */
.chip[data-tip]{position:relative; cursor:help}
.chip[data-tip]::after{
  content:attr(data-tip); display:none; position:absolute;
  top:calc(100% + 6px); left:0; width:max-content; max-width:380px;
  background:var(--card); border:1px solid var(--ink); border-radius:2px;
  box-shadow:3px 3px 0 var(--wash); padding:8px 11px; font-size:12px;
  line-height:1.55; color:var(--ink); text-align:left; white-space:pre-line; z-index:40;
}
.chip[data-tip]:hover::after{display:block}
input[type=file]{display:none}

.radio{display:flex; gap:14px}
.radio label{display:flex; align-items:center; gap:7px; background:var(--card); border:1px solid var(--rule); border-radius:2px; padding:10px 14px; cursor:pointer}
.radio label.sel{border-color:var(--ink); box-shadow:inset 0 0 0 1px var(--ink); color:var(--ink); font-weight:600}
.radio input{accent-color:var(--ink)}

.verify-row{display:flex; align-items:baseline; gap:10px; padding:9px 2px; border-bottom:1px solid var(--rule); font-size:14px}
.verify-row .k{flex:none; max-width:60%}
.verify-row .lead{flex:1; border-bottom:1px dotted var(--faint); transform:translateY(-4px)}
.verify-row .v{color:var(--gray); font-size:13px; font-family:var(--mono); font-variant-numeric:tabular-nums; text-align:right}
.verify-row input{accent-color:var(--ink); width:17px; height:17px; flex:none; align-self:center}
.verify-row input[type=text]{width:150px; text-align:right; font-family:var(--mono); font-size:13px; padding:3px 6px; background:var(--card); border:1px solid var(--rule); border-radius:2px; color:var(--ink); height:auto}
.doctrine{border:none; border-left:3px solid var(--ink); border-radius:0; padding:6px 0 6px 14px; font-family:var(--serif); font-style:italic; font-size:14px; color:var(--gray); margin:18px 0 4px}

.math-line{display:flex; align-items:baseline; gap:10px; padding:8px 0; border-bottom:none; font-size:14px}
.math-line .k{flex:none}
.math-line .lead{flex:1; border-bottom:1px dotted var(--faint); transform:translateY(-4px)}
.math-line .v{font-family:var(--mono); font-variant-numeric:tabular-nums; font-weight:600; text-align:right}
.math-line.total{border-top:1px solid var(--ink); margin-top:6px; padding-top:10px; font-size:15px}
.math-line.total .v{font-size:17px}
.math-line.grand{border-bottom:3px double var(--ink); padding-bottom:10px}
.sheet{background:var(--wash); border:1px solid var(--rule); border-radius:2px; padding:14px 16px; margin-top:16px}
.sheet h3{font-size:10.5px; text-transform:uppercase; letter-spacing:1.5px; color:var(--gray); font-weight:600; margin-bottom:8px}
.formula{font-size:12px; color:var(--gray); margin-top:10px; font-family:var(--serif); font-style:italic}

.export-fields{list-style:none}
.export-fields li{display:flex; align-items:baseline; gap:10px; padding:7px 0; font-size:14px}
.export-fields li .fkey{font-family:var(--mono); font-size:10.5px; color:var(--faint); margin-left:7px}
.export-fields li .lead{flex:1; border-bottom:1px dotted var(--faint); transform:translateY(-4px)}
.export-fields li .v{color:var(--gray); font-family:var(--mono); font-variant-numeric:tabular-nums; text-align:right; max-width:55%}
.notin{font-size:12px; color:var(--gray); margin-top:12px; font-family:var(--serif); font-style:italic}

.role-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:14px}
.role-card{
  display:flex; flex-direction:column; gap:6px; text-align:left;
  background:var(--card); border:1px solid var(--rule); border-radius:2px;
  padding:14px; color:var(--ink); cursor:pointer; font-family:inherit; font-size:13px;
}
.role-card b{font-family:var(--serif); font-size:16px; color:var(--ink)}
.role-card span{color:var(--gray)}
.role-card:hover, .role-card.sel{border-color:var(--ink)}
.role-card.sel{box-shadow:inset 0 0 0 1px var(--ink)}

.toast{
  position:fixed; bottom:26px; left:50%; transform:translateX(-50%);
  background:var(--ink); color:var(--paper);
  border-radius:2px; padding:10px 18px; font-size:14px; opacity:0; transition:opacity .25s; z-index:30;
}
.toast.show{opacity:1}
.offline-badge{display:inline-flex; align-items:center; gap:6px; font-size:10.5px; color:var(--gray); border:1px solid var(--rule); border-radius:2px; padding:3px 9px; letter-spacing:.08em; text-transform:uppercase}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand"><span data-i18n="brand"></span></div>
  <nav class="tabs">
    <button class="tab active" data-view="dashboard" data-roles="importer"><span data-i18n="dash"></span></button>
    <button class="tab" data-view="consignments" data-roles="importer"><span data-i18n="cons"></span></button>
    <button class="tab" data-view="export" data-roles="importer"><span data-i18n="exp"></span></button>
    <button class="tab" data-view="packs" data-roles="exporter trader"><span data-i18n="packsTab"></span></button>
    <button class="tab" data-view="review" data-roles="verifier"><span data-i18n="reviewTab"></span></button>
  </nav>
  <span class="offline-badge"><span data-i18n="offline"></span></span>
  <button class="top-link" id="cbamLink" onclick="openPrimer()"><span data-i18n="whatIsCbam"></span></button>
  <button class="role-btn" id="roleBtn" title="Change role"><span id="roleName"></span></button>
  <select id="langSel" class="lang-select"></select>
</header>

<main>

<!-- DASHBOARD (importer) -->
<section class="view active" id="view-dashboard">
  <h2><span data-i18n="dash"></span></h2>
  <p class="sub"><span data-i18n="dashSub"></span></p>

  <div class="card">
      <h3><span data-i18n="massLineTitle"></span> <span class="tip" data-tipkey="tipMass" tabindex="0">?</span> <select id="yearSel" style="float:right;background:var(--card);border:1px solid var(--rule);color:var(--ink);border-radius:2px;padding:3px 6px;font-family:var(--mono)"></select></h3>
    <div class="big" id="massBig">0.0<span class="unit">t</span></div>
    <div class="bar"><div class="fill" id="massFill" style="width:0%"></div></div>
    <div class="line50"><span id="massPct">0% of the line</span><span><span data-i18n="lineLabel"></span></span></div>
      <p class="note" id="massNote"></p>
      <p class="note warn" id="liableNote" style="display:none"></p>
  </div>

  <div class="card">
    <h3><span data-i18n="exposureTitle"></span> <span class="tip" data-tipkey="tipExposure" tabindex="0">?</span></h3>
    <div id="exposureBody"></div>
  </div>

  <div class="grid">
    <div class="card">
      <h3><span data-i18n="etsTitle"></span> <span class="tip" data-tipkey="tipEts" tabindex="0">?</span></h3>
      <div class="big">€<span id="etsVal">75.36</span></div>
      <p class="note" id="etsNote"></p>
      <p class="note"><span data-i18n="etsCardNote"></span></p>
      <details style="margin-top:10px">
        <summary class="hint" style="cursor:pointer"><span data-i18n="etsPlainSummary"></span></summary>
        <p class="note" style="margin-top:10px"><span data-i18n="etsPlainP1"></span></p>
        <p class="note"><span data-i18n="etsPlainP2"></span></p>
        <p class="note"><span data-i18n="etsPlainP3"></span></p>
        <p class="note"><span data-i18n="etsPlainP4"></span></p>
      </details>
      <p class="note"><span data-i18n="etsEditLbl"></span> <input id="etsInput" type="number" step="0.01" style="width:110px;background:var(--card);border:1px solid var(--rule);color:var(--ink);border-radius:2px;padding:5px 8px;font-family:var(--mono)"></p>
    </div>
    <div class="card">
      <h3><span data-i18n="deadlinesTitle"></span> <span class="tip" data-tipkey="tipDeadlines" tabindex="0">?</span></h3>
      <div class="math-line"><span class="k"><span data-i18n="dlSalesLbl"></span> — 2027-02-01</span><span class="lead"></span><span class="v" id="dl1"></span></div>
      <div class="math-line"><span class="k"><span data-i18n="dlFirstDecl"></span> — 2027-09-30</span><span class="lead"></span><span class="v" id="dl2"></span></div>
      <p class="note"><span data-i18n="brusselsTime"></span></p>
    </div>
  </div>

  <div class="card">
    <h3><span data-i18n="dossierTitle"></span> <span class="tip" data-tipkey="tipDossier" tabindex="0">?</span></h3>
    <p class="note" id="dossierNote" style="margin-bottom:10px"></p>
    <div class="chips" id="dossierChips"></div>
  </div>
</section>

<!-- CONSIGNMENTS (importer) -->
<section class="view" id="view-consignments">
  <h2><span data-i18n="cons"></span></h2>
  <p class="sub"><span data-i18n="consSub"></span></p>
  <button class="btn" id="newConsBtn" style="margin:10px 0 16px">＋ <span id="newConsLbl"></span></button>
  <table>
    <thead><tr>
      <th><span data-i18n="cnCode"></span></th>
      <th><span data-i18n="goods"></span></th>
      <th><span data-i18n="netMass"></span></th>
      <th><span data-i18n="importDate"></span></th>
      <th><span data-i18n="basis"></span></th>
      <th><span data-i18n="statusHdr"></span></th>
    </tr></thead>
    <tbody id="consTable"></tbody>
  </table>
</section>

<!-- EXPORT (importer) -->
<section class="view" id="view-export">
  <h2><span data-i18n="exp"></span></h2>
  <p class="sub"><span data-i18n="exportSub"></span></p>
  <div class="card">
    <div class="fgroup">
      <label><span data-i18n="consignmentLbl"></span></label>
      <select id="exportSel"></select>
    </div>
    <div id="exportBody"></div>
  </div>
</section>

<!-- DATA PACKS (exporter, trader) -->
<section class="view" id="view-packs">
  <h2><span data-i18n="packsTab"></span></h2>
  <p class="sub"><span data-i18n="packsSub"></span></p>
  <div class="card">
    <p class="note" id="packRoleNote" style="font-size:13px"></p>
  </div>
  <button class="btn" id="newPackBtn" style="margin:10px 0 16px">＋ <span id="newPackLbl"></span></button>
  <div class="card">
    <div class="fgroup">
      <label><span data-i18n="recordLbl"></span></label>
      <select id="packSel"></select>
    </div>
    <div id="packBody"></div>
  </div>
</section>

<!-- REVIEW (verifier) -->
<section class="view" id="view-review">
  <h2><span data-i18n="reviewTab"></span></h2>
  <p class="sub"><span data-i18n="reviewSub"></span></p>
  <div class="card">
    <p class="note" id="reviewNote" style="font-size:13px"></p>
    <p class="note" id="verifyHowNote" style="font-size:13px"></p>
    <p style="margin-top:10px"><button class="btn ghost" onclick="pickPackFile()">✓ <span data-i18n="verifyPackFileBtn"></span></button>
    <input type="file" id="packFile" accept=".json,.jsonld,application/json" style="display:none" onchange="onPackFile(this)"></p>
    <p class="note" id="verifyResult" style="margin-top:6px"></p>
  </div>
  <table style="margin-top:18px">
    <thead><tr>
      <th><span data-i18n="cnCode"></span></th>
      <th><span data-i18n="goods"></span></th>
      <th><span data-i18n="netMass"></span></th>
      <th><span data-i18n="dateHdr"></span></th>
      <th><span data-i18n="basis"></span></th>
      <th><span data-i18n="sourceDocsHdr"></span></th>
      <th><span data-i18n="statusHdr"></span></th>
      <th></th>
    </tr></thead>
    <tbody id="reviewTable"></tbody>
  </table>
</section>

</main>

<footer>
  <div data-i18n="footerNote"></div>
</footer>

<!-- WIZARD -->
<div class="modal-bg" id="wizBg">
  <div class="modal">
    <h2 id="wizTitle"></h2>
    <div class="stepper">
      <div class="step" data-s="1">1 · <span data-i18n="attach"></span></div>
      <div class="step" data-s="2">2 · <span data-i18n="fields"></span></div>
      <div class="step" data-s="3">3 · <span data-i18n="verify"></span></div>
    </div>
    <div id="wizBody"></div>
    <div style="display:flex; justify-content:space-between; margin-top:18px">
      <button class="btn ghost" id="wizBack"></button>
      <div style="display:flex; gap:10px">
        <button class="btn ghost" id="wizCancel"></button>
        <button class="btn" id="wizNext"></button>
      </div>
    </div>
  </div>
</div>

<!-- FIRST-RUN WELCOME (language → CBAM primer → role) + settings reset (R47) -->
<div class="modal-bg" id="roleBg">
  <div class="modal">
    <div id="wsLang" style="display:none">

// R7/R6/R4 exposure aggregation for the dashboard card. Reuses the pinned
// mark-up and factor schedules; recomputes from the stored per-tonne fields
// so any year's RULES can be applied to any import year's records
// (exposureFor(imports, rules) — the 2027 projection is exposureFor(year, 2027)).
function exposureFor(importYear, rulesYear) {
  const y = rulesYear || importYear;
  const price = ets.value || 0;
  const rows = cons.filter(isCons).filter(c => c.importDate && c.importDate.startsWith(String(importYear)));
  const lineT = kgToT(rows.filter(c => !ALWAYS_LIABLE.has(c.sector)).reduce((a, c) => a + (c.netMassKg || 0), 0));
  const overLine = lineT >= 50; // R1 cliff: under 50 t only electricity & hydrogen are due
  const active = overLine ? rows : rows.filter(c => ALWAYS_LIABLE.has(c.sector));
  const parts = active.map(c => {
    const raw = kgToT(c.netMassKg || 0) * (c.emissionsPerT || 0);
    const unv = c.basis !== "actual" || !c.verifierChecked;
    const mu = unv ? (markupPct(y, c.sector) || 0) : 0;
    const marked = raw * (1 + mu / 100);
    const f = (cbamFactorPct(y) || 0) / 100;
    const paid = c.carbonPricePaid || 0;
    return {
      net: Math.max(0, marked * f * price - paid),
      markup: raw * (mu / 100) * f * price,
      paid,
    };
  });
  return {
    overLine,
    due: parts.reduce((a, p) => a + p.net, 0),
    markup: parts.reduce((a, p) => a + p.markup, 0),
    paid: parts.reduce((a, p) => a + p.paid, 0),
  };
}

    // production statements) is parsed locally into field CANDIDATES;
    // images/PDFs wait for manual entry — offline OCR is the companion
    // tool's job, never the core's (R16/R17/R22).
    const rec = { name: f.name, parsed: false, fields: {} };
    const finish = () => {
      wiz.docs[k].push(rec);
      if (k === "production") prefillFromProduction();
      done();
    };
    if (/\.(txt|xml|csv|json)$/i.test(f.name)) {
      const r = new FileReader();
      r.onload = () => {
        const text = String(r.result);
        rec.fields = parseDocument(k, text);
        rec.parsed = Object.keys(rec.fields).length >= 2;
        rec.raw = text.length > 1200 ? text.slice(0, 1200) + " …" : text;
        finish();
      };
      r.onerror = finish;
      r.readAsText(f);
    } else finish();
  });
}

function renderLiveMath() {
  const body = document.getElementById("liveMathBody");
  if (!body || !wiz) return;
  const c = computeDraft();
  const showMu = c.unverified && c.mu !== null && c.mu > 0;
  const netVal = c.net === null ? c.gross : c.net;
  // A receipt, not a summary (demo feedback): every multiplication the bill
  // is made of, in order, with its intermediate result on its own line.
  const price = ets.value || 0;
  const rawEm = c.tMass * c.perT;
  const payable = c.factorPct === null ? null : c.totalEm * (c.factorPct / 100);
  const cost = (payable === null ? c.totalEm : payable) * price;
  const paid = parseFloat(wiz.draft.carbonPricePaid) || 0;
  const t2 = n => n.toLocaleString("en", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  body.innerHTML = `
    ${line(t("massT"), t2(c.tMass) + " t")}
    ${line(t("basisLbl"), c.basis === "actual" ? t("actual") + (!c.unverified ? " · " + t("verified") : "") : t("dflt"))}
    ${line("× " + t("emissionsPerT"), t2(c.perT) + " tCO₂e/t")}
    ${line("= " + t("emissionsTotal"), t2(rawEm) + " tCO₂e")}
    ${showMu ? line("+ " + t("markUp") + " (" + c.y + ")" + (c.basis === "actual" ? " · " + t("markupUntil") : ""), "+" + c.mu + "%", "warn") : ""}
    ${showMu ? line("= " + t("emissionsAfterMarkup"), t2(c.totalEm) + " tCO₂e") : ""}
    ${c.factorPct !== null ? line("× " + t("factorLbl") + " (" + c.y + ")", c.factorPct + "%") : ""}
    ${payable !== null ? line("= " + t("payableEm"), t2(payable) + " tCO₂e") : ""}
    ${line("× " + t("etsCached"), "€" + t2(price) + " / tCO₂e")}
    ${line("= " + t("certCost"), "€" + t2(cost))}
    ${line("− " + t("minusPaid"), "€" + t2(paid))}
    ${line(t("netLbl"), "€" + t2(netVal), "total grand")}
    ${(wiz.mode === "pack" && c.basis === "actual" && c.unverified && showMu) ? line(t("onceVerified"), "€" + t2(c.netVerified), "good") : ""}
    <div class="formula">${t("formulaNet")}</div>
    ${wiz.mode === "pack" ? `<p class="note">${t("packBuyerNote")}</p>` : ""}
    ${packWorthLine(c)}`;
}
// Pack mode only: the buyer-side value of this pack's data, at 2027 rules
// and the cached price. Mark-up slice only — the default-vs-actual intensity
// gap needs the Commission workbook (0.2.0), same boundary as the preview.
function packWorthLine(c) {
  if (wiz.mode !== "pack") return "";
  const mu27 = markupPct(2027, c.sector) || 0;
  const worth = c.tMass * c.perT * (mu27 / 100) * ((cbamFactorPct(2027) || 0) / 100) * (ets.value || 0);
  const worthText = c.unverified
    ? t("packWorthDefault").replace("{m}", mu27).replace("{y}", 2027).replace("{x}", fmt2(worth))
    : t("packWorthVerified").replace("{m}", mu27).replace("{y}", 2027)
        .replace("{n}", c.tMass.toLocaleString("en", { maximumFractionDigits: 1 })).replace("{x}", fmt2(worth));
  return `<p class="note good" style="font-size:13px; margin-top:10px">${worthText}</p><p class="note">${t("packWorthNote")}</p>`;
}

// Math for a SAVED record, derived from its stored fields at read time —
// the pinned schedules, the same rule as the wizard panel. The snapshot
// saved with the record is only the creation-time view: verification is a
// later act (Verifier → Review), and when it happens the mark-up MUST drop
// out of every rendered or exported number.
function recordMath(c) {
  const y = c.importDate ? parseInt(c.importDate.slice(0, 4), 10) : year;
  const tMass = kgToT(c.netMassKg || 0);
  const perT = c.emissionsPerT || 0;
  const sector = c.sector || (CN[c.cnCode] || {}).s || "";
  const unverified = c.basis !== "actual" || !c.verifierChecked;
  const muRaw = markupPct(y, sector);
  const mu = unverified && muRaw !== null ? muRaw : 0;
  const totalEm = tMass * perT * (1 + mu / 100);
  const price = ets.value || 0;
  const paid = c.carbonPricePaid || 0;
  const gross = totalEm * price - paid;
  const factorPct = cbamFactorPct(y);
  const net = factorPct === null ? null : totalEm * (factorPct / 100) * price - paid;
  return { y, tMass, perT, sector, unverified, mu, totalEm, gross, factorPct, net };
}

  // penalty): quantify the +mark-up this pack's data eliminates for the

  const rawT = kgToT(c.netMassKg || 0);
  const unv = c.basis !== "actual" || !c.verifierChecked;
  const mu27 = markupPct(2027, c.sector) || 0;
  const worth = rawT * (c.emissionsPerT || 0) * (mu27 / 100) * ((cbamFactorPct(2027) || 0) / 100) * (ets.value || 0);
  const worthLine = unv
    ? t("packWorthDefault").replace("{m}", mu27).replace("{y}", 2027).replace("{x}", fmt2(worth))
    : t("packWorthVerified").replace("{m}", mu27).replace("{y}", 2027)
        .replace("{n}", rawT.toLocaleString("en", { maximumFractionDigits: 1 })).replace("{x}", fmt2(worth));
  body.innerHTML = `
    <h3 style="margin:8px 0">${t("packPreview")} <span class="tip" data-tipkey="tipLeaves" tabindex="0">?</span></h3>
    <ul class="export-fields">${leaders(localize(fields))}</ul>

    </div>
    <button class="btn" style="margin-top:14px" onclick="doPackExport('${c.id}')">↓ ${t("exp")}</button>`;
}
function downloadJSON(obj, name) {
  const blob = new Blob([JSON.stringify(obj, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  URL.revokeObjectURL(a.href);
}

  };
}
function packEvidenceLeaves(c) {
  const fields = packExportFields(c);
  const leaves = Object.entries(fields).map(([k, v]) => k + "=" + v);
  (c.docs && c.docs.production ? c.docs.production : []).forEach(r => leaves.push("evidence:" + r.name));
  return leaves;
}
function doPackExport(id) {
  const c = cons.find(x => x.id === id);
  if (!c) return;
  const plain = () => {
    downloadJSON(packExportFields(c), "kaimeter-pack-" + c.id + ".json");
    toast(t("toastExported"));
  };
  // From file:// there is no core to seal with — plain JSON, honestly
  // labelled by the preview note. Served by the binary, the export is the
  // R21 sealed pack: Merkle root over the evidence, Ed25519-signed,
  // serialized as a W3C Verifiable Presentation.
  if (!API_UP) { plain(); return; }
  fetch("/api/pack/seal", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      installation_ref: c.installation || "",
      cn_code: c.cnCode,
      emission_factor_tco2e_per_t: c.emissionsPerT || 0,
      embedded_emissions_tco2e: kgToT(c.netMassKg || 0) * (c.emissionsPerT || 0),
      evidence_leaves: packEvidenceLeaves(c),
    }),
  })
    .then(r => (r.ok ? r.json() : null))
    .then(j => {
      if (!j || !j.vp) { plain(); return; }
      downloadJSON(j.vp, "kaimeter-pack-" + c.id + ".vp.jsonld");
      toast(t("toastExported"));
    })
    .catch(plain);
}

// Verifier → Review: import a downloaded pack file and check its proof.
// The check itself runs in the verifier's own copy of the core — nothing
// but the file is used, no Kaimeter server, no shared state (R21/R28).
function pickPackFile() { document.getElementById("packFile").click(); }
function onPackFile(input) {
  const f = input.files && input.files[0];
  input.value = "";
  if (!f) return;
  const el = $("#verifyResult");
  const reader = new FileReader();
  reader.onload = () => {
    let vp;
    try { vp = JSON.parse(String(reader.result)); } catch (e) { el.textContent = t("verifyBad"); return; }
    if (!API_UP) { el.textContent = t("verifyNeedsCore"); return; }
    fetch("/api/pack/verify", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ vp }),
    })
      .then(r => (r.ok ? r.json() : null))
      .then(j => {
        if (j && j.valid && j.content) {
          el.innerHTML = `<span class="stamp">${t("verifyOk")}</span> <span class="hint">${esc(j.content.cn_code || "")} · ${esc(j.content.installation_ref || "")}</span>`;
        } else el.textContent = t("verifyBad");
      })
      .catch(() => { el.textContent = t("verifyNeedsCore"); });
  };
  reader.readAsText(f);
}

function renderReview() {
  $("#reviewNote").textContent = t("reviewNote");
  $("#verifyHowNote").textContent = t("verifyHow");
  const rows = cons.filter(isPack);
  const tb = $("#reviewTable");
  tb.innerHTML = rows.length ? rows.slice().reverse().map(c => {
    const { name } = consRow(c);
    const docCount = ["energy", "materials", "production"].reduce((a, k) => a + (c.docs[k] || []).length, 0);
    const status = c.verifierChecked
      ? `<span class="stamp">${t("verified")}</span>`
      : `<span class="hint">${t("packVerifyPending")}</span>`;
    const action = c.verifierChecked ? "" : `<button class="btn" style="padding:5px 10px; font-size:12px" onclick="verifyPack('${c.id}')">${t("reviewVerifyBtn")}</button>`;
    return `<tr>
      <td>${esc(c.cnCode)}</td>
      <td>${esc(name)}</td>
      <td>${kgToT(c.netMassKg).toLocaleString("en", { maximumFractionDigits: 1 })} t</td>
      <td>${esc(c.importDate)}</td>
      <td>${c.basis === "actual" ? t("actual") : t("dflt")}</td>
      <td>${docCount}</td>
      <td>${status}</td>
      <td>${action}</td>
    </tr>`;
  }).join("") : `<tr><td colspan="8" style="color:var(--faint)">${t("noPacks")}</td></tr>`;
}
function verifyPack(id) {
  const c = cons.find(x => x.id === id);
  if (!c || c.verifierChecked) return;
  c.verifierChecked = true;
  c.verifiedAt = new Date().toISOString().slice(0, 10);
  c.status = "verified";
  // Verification changes the math: the mark-up the creation-time snapshot
  // carried is gone — recompute so previews and exports pay on actuals.
  const m = recordMath(c);
  c.totalEm = m.totalEm; c.gross = m.gross; c.net = m.net; c.factorPct = m.factorPct;
  saveCons();
  renderReview();
  toast(t("toastVerifiedPack"));
}

function renderExport() {
  const sel = $("#exportSel");
  const rows = cons.filter(isCons);
  // Rebuilding the options resets the select to its first entry — capture
  // the user's pick first and restore it, or every change snaps back. A
  // just-saved record wins, so the new consignment is the shown context.
  const wanted = justSavedId && rows.some(x => x.id === justSavedId) ? justSavedId : sel.value;
  justSavedId = null;
  sel.innerHTML = rows.length ? rows.slice().reverse().map(c => {
    const { name } = consRow(c);
    return `<option value="${c.id}">${esc(c.cnCode)} — ${esc(name)} — ${kgToT(c.netMassKg).toLocaleString("en", { maximumFractionDigits: 1 })} t — ${esc(c.importDate)}</option>`;
  }).join("") : `<option value="">${t("noCons")}</option>`;
  if (rows.some(x => x.id === wanted)) sel.value = wanted;
  const body = $("#exportBody");
  const c = rows.find(x => x.id === sel.value);
  if (!c) { body.innerHTML = `<p class="note">${t("exportSelLbl")}</p>`; return; }
  const fields = [
    ["consignment_id", c.id],
    ["cn_code", c.cnCode],
    ["net_mass_kg", c.netMassKg],
    ["country_of_origin", c.origin],
    ["production_country", c.prodCountry],
    ["installation_id", c.installation],
    ["import_date", c.importDate],
    ["determination_basis", c.basis],
    ["embedded_emissions_tco2e_per_t", c.emissionsPerT],
    ["total_embedded_emissions_tco2e", Math.round(c.totalEm * 1000) / 1000],
    ["carbon_price_paid_eur", c.carbonPricePaid],
  ];
  body.innerHTML = `
    <h3 style="margin:8px 0">${t("exportFieldsTitle")} <span class="tip" data-tipkey="tipLeaves" tabindex="0">?</span></h3>
    <ul class="export-fields">${leaders(localize(fields))}</ul>
    <p class="notin">${t("notIncluded")}</p>
    <button class="btn" style="margin-top:14px" onclick="doExport('${c.id}')">↓ ${t("exp")}</button>`;
}
function doExport(id) {
  const c = cons.find(x => x.id === id);
  if (!c) return;
  const m = recordMath(c);
  downloadJSON({
    consignment_id: c.id, cn_code: c.cnCode, net_mass_kg: c.netMassKg,
    country_of_origin: c.origin, production_country: c.prodCountry,
    installation_id: c.installation, import_date: c.importDate,
    determination_basis: c.basis,
    embedded_emissions_tco2e_per_t: c.emissionsPerT,
    total_embedded_emissions_tco2e: Math.round(m.totalEm * 1000) / 1000,
    carbon_price_paid_eur: c.carbonPricePaid,
  }, "kaimeter-consignment-" + c.id + ".json");
  toast(t("toastExported"));
}
$("#exportSel").addEventListener("change", renderExport);
$("#packSel").addEventListener("change", renderPacks);

// Term tooltips: resolve every data-tipkey through the translation layer so
// tip text re-localizes with the rest of the UI (R13). The CSS reads the
// data-tip attribute directly, so this must run after EVERY render pass —
// the views and the wizard body inject fresh tip elements, and an unresolved
// tipkey renders as a blank tooltip.
function resolveTips() {
  document.querySelectorAll("[data-tipkey]").forEach(el => {
    const txt = t(el.dataset.tipkey);
    el.setAttribute("data-tip", txt);
    el.setAttribute("aria-label", txt);
  });
}
function renderAll() {
  document.title = t("docTitle");
  document.documentElement.lang = lang;
  localizeChrome();
  $("#roleName").innerHTML = role ? `<span class="rname">${t(roleKey(role))}</span>` : "·";
  // The guide's reference schedules re-render with the dictionaries.
  const ps = $("#primerSched");
  if (ps) ps.innerHTML = schedHtml();
  // Language picker: one option per available dictionary, named natively —
  // adding a locale to L adds it to the picker (README i18n roadmap).
  const langSel = $("#langSel");
  langSel.innerHTML = Object.keys(L).sort().map(c =>
    `<option value="${c}"${c === lang ? " selected" : ""}>${esc(L[c].langName || c)}</option>`).join("");
  langSel.setAttribute("aria-label", t("language"));
  const newBtn = $("#newConsBtn");
  newBtn.style.display = role === "verifier" ? "none" : "";
  renderTabs();
  if (currentView === "dashboard") renderDashboard();
  else if (currentView === "consignments") renderConsignments();
  else if (currentView === "export") renderExport();
  else if (currentView === "packs") renderPacks();
  else if (currentView === "review") renderReview();
  renderWizard();
  resolveTips();
}
function toast(msg) {
  const el = $("#toast");
  el.textContent = msg;
  el.classList.add("show");
  setTimeout(() => el.classList.remove("show"), 2400);
}
$("#newConsBtn").addEventListener("click", openWizard);
$("#newPackBtn").addEventListener("click", openWizard);
$("#roleBtn").addEventListener("click", () => openRoleModal(false));
$("#roleClose").addEventListener("click", closeRoleModal);
$("#yearSel").addEventListener("change", e => { year = parseInt(e.target.value, 10); renderDashboard(); });
$("#etsInput").addEventListener("change", e => {
  const v = parseFloat(e.target.value);
  if (!isNaN(v) && v > 0) { ets.value = v; ets.date = new Date().toISOString().slice(0, 10); saveEts(); renderDashboard(); toast(t("etsUpdated")); }
});

// lang via the picker; the hash stays in sync so static chrome and the
// :target CSS follow. Handles any locale count, not just the zh toggle.
$("#langSel").addEventListener("change", e => {
  lang = e.target.value;
  localStorage.setItem("kaimeter.lang", lang);
  location.hash = lang === "en" ? "#top" : "#lang-" + lang;
  renderAll();
});
window.addEventListener("hashchange", () => {
  const raw = location.hash.startsWith("#lang-") ? location.hash.slice(6) : "en";
  const h = raw === "zh" ? "zh-CN" : raw; // legacy #lang-zh deep links
  lang = L[h] ? h : "en";
  localStorage.setItem("kaimeter.lang", lang);
  renderAll();
});
(function init() {
  const normLang = v => (v === "zh" ? "zh-CN" : v); // migrate pre-rename picks
  const stored = normLang(localStorage.getItem("kaimeter.lang"));
  if (stored && L[stored]) lang = stored;
  if (location.hash.startsWith("#lang-")) {
    const h = normLang(location.hash.slice(6));
    if (L[h]) lang = h;
  }
  if (lang !== "en" && location.hash !== "#lang-" + lang) {
    location.hash = "#lang-" + lang;
  }
  renderAll();
  // R47: first-run setup asks who the user is — before any workflow renders.
  if (!role) openRoleModal(true);
  // Server bridge: when served by the binary, hydrate from the API on first
  // run (server is the source of truth until the user records locally).
  apiHydrate();
})();
</script>
</body>

 a permit is the number on this card.`,etsPlainP2:`<b>A CBAM certificate is the import version of an ETS permit.</b> CBAM — the Carbon Border Adjustment Mechanism — is the rule that extends the same carbon cost to imported goods: the importer surrenders one CBAM certificate per tonne of embedded CO₂e, at the ETS price, so imported carbon costs the same as EU-made carbon.`,etsPlainP3:`<b>Who buys, where, when:</b> only the authorised EU importer — the company responsible for the declaration — through the EU CBAM Registry, from February 1st, 2027. The price follows the ETS auction average — quarterly in 2026, weekly from 2027. Mills, producers, and trading houses never buy: they supply the data the declaration is built on.`,etsPlainP4:`<b>Why "cached":</b> Kaimeter runs offline and never fetches prices on its own. This card shows the last price stored on this device (2026-04-07, the first published CBAM certificate price); correct it by hand at any time.`,etsPlainSummary:`Plain words: what is this price? What is a CBAM certificate?`,etsTitle:`EU carbon price (ETS)`,etsUpdated:`Carbon price updated`,exp:`Export`,exportFieldsTitle:`Fields that will leave this device`,exportSelLbl:`Choose a record to preview its export`,exportSub:`Preview exactly which fields leave — nothing else. The file is plain, human-readable JSON.`,exported:`Exported`,exposure:`Exposure`,exposureNote:`Estimates at the cached EU carbon price ({p} €/tCO₂e); net = emissions × CBAM factor × price − carbon paid (Formula A) pending Art 9(5). Excludes the default-vs-actual intensity gap — Commission defaults are conservative, so verified actuals save more than shown.`,exposureTitle:`Exposure & savings`,"ext.amount":`Amount`,"ext.buyerName":`Buyer`,"ext.buyerTaxId":`Buyer tax ID`,"ext.elecKwh":`Electricity (kWh)`,"ext.exportDate":`Export date`,"ext.gasM3":`Natural gas (m³)`,"ext.invDate":`Invoice date`,"ext.invNo":`Invoice no.`,"ext.item":`Item`,"ext.millName":`Company`,"ext.netWeightKg":`Net weight (kg)`, etLbl:`Net certificate obligation`,netMass:`Net mass (kg)`,newConsLbl:`New consignment`,newPackLbl:`New data pack`,next:`Next`,noCons:`No consignments yet. Create the first record.`,noPacks:`No data packs yet. Create the first record.`,noRecords:`No records yet.`,noStructured:`no structured data — manual entry`,none:`none attached`,notIncluded:`Not included: attachments, internal notes, other records, anything not listed above.`,offline:`Offline`,onceVerified:`Once verified`,origin:`Country of origin`,packBuyerNote:`These euros are your EU buyer's certificate bill — the mill never buys certificates; it supplies the data.`,packNotIncluded:`Never included: supplier identity, prices, margins, internal notes.`,packPreview:`Pack preview — fields that will leave this device`,packRoleNoteExporter:`Attach the mill records, verify the fields, and hand your buyer a clean data pack: emissions per CN code — no pricing, no internal data. You approve every export.`,packRoleNoteTrader:`Packs pass through you: aggregate suppliers, check each order, and give every buyer its own pack. Supplier identity and pricing stay masked.`,packSealedNote:`Exported from the served app, the pack is sealed: a W3C Verifiable Presentation signed with the mill's device key (Ed25519). The signature covers a fingerprint of the production evidence — a Merkle commitment, one hash that certifies every attached record. Change one number anywhere and the signature breaks; the buyer's machine proves it offline, contacting no one. From file:// it downloads as a plain demonstration JSON.`,packVerifyPending:`Pending verification`,packWorthDefault:`Without verified data your buyer pays the +{m}% ({y}) mark-up — est. +€{x} on the same tonnage.`,packWorthNote:`Estimate only — the buyer's bill also depends on the carbon price when they file and their Article 9 position. Commission defaults are conservative, so verified actuals usually save more than the mark-up alone.`,packWorthTitle:`What your data is worth to your buyer`,packWorthVerified:`Verified actuals avoid the +{m}% ({y}) penalty mark-up on {n} t — est. €{x} at the cached EU carbon price.`,packsSub:`Emissions data per CN code, packed for your buyers. You approve every field that leaves.`,packsTab:`Data packs`,payableEm:`Certificate-covered emissions`,pctOfLine:`{p}% of the line`,prefillNote:`Prefilled from {f} — check against the source before saving.`,primerP1:`<b>CBAM — the Carbon Border Adjustment Mechanism — is the EU's charge on carbon in imports.</b> From January 1st, 2026, iron &amp; steel, aluminium, cement, fertilisers, hydrogen, and electricity imported into the EU carry a charge on the carbon emitted to produce them.`,primerP2:`<b>The EU importer pays — nobody outside the EU pays the EU directly.</b> The importer buys CBAM certificates — one per tonne of embedded CO₂e, at the EU's carbon-market price — and files one annual declaration.`,primerP3:`<b>The bill is computed from the mill's data.</b> Without verified data from the producer, the importer must use Brussels' conservative default values plus a penalty mark-up: +10% in 2026, +20% in 2027, +30% from 2028. Unverified data is the expensive option.`,primerP4:`<b>The charge is small now and grows every year.</b> Who buys: only the authorised EU importer — the mill never buys. From whom: the European Commission, through the EU CBAM Registry. When: sales open February 1st, 2027; after that the importer buys whenever it suits during the year — there is no single purchase day. At what price: the EU ETS auction average, published per quarter in 2026 and per week from 2027 — it does not move in real time. The first surrender is due with the annual declaration on September 30th, 2027, and the payable share rises from 2.5% in 2026 to 100% by 2034.`,primerTitle:`What is CBAM? — the 60-second guide`,prodCountry:`Production country`,productionHint:`Production log, outbound records, customs declarations — the net-tonne denominator and CN codes.`,productionTitle:`3 · Production output + customs records`,projLabel:`Same imports under 2027 rules`,recordLbl:`Record`,removeDoc:`Remove`,reviewNote:`The exporter submits the dossier; you review the evidence and mark the pack verified; the buyer's declaration then relies on it. Verification is one-way — nothing here is edited.`,reviewSub:`The exporter submits the dossier; you review the evidence and mark the pack verified. Nothing is edited here.`,reviewTab:`Review`,reviewVerifyBtn:`Mark verified`,roleDone:`Done`,roleExporter:`Exporter / mill / producer`,roleExporterDesc:`Produce the data packs your buyers need — nothing leaves without your approval.`,roleImporter:`Importer / declarant`,roleImporterDesc:`Track what you import, watch the 50-tonne line, project the certificate bill, prepare the filing.`,roleLabel:`Role`,roleSub:`Kaimeter renders the workflow for your role. You can change it anytime — the role button in the top bar.`,roleTitle:`Who are you?`,roleTrader:`Trading house`,roleTraderDesc:`Aggregate supplier packs, pass them through, keep per-buyer coverage.`,roleVerifier:`Verifier`,roleVerifierDesc:`Open dossiers read-only; verify the evidence.`,sampleCodes:`Sample CN codes for the demo — the full catalog seeds from the Commission workbook in the core.`,save:`Save record`,schedDetails:`Reference schedules — mark-up & CBAM factor`,sector:`Sector`,sourceAttach:`attachment`,sourceDocsHdr:`Source docs`,sourceManual:`manual entry`,staled:`Cached since 2026-04-07 (first published CBAM certificate price). Network sync when you connect.`,statusHdr:`Status`,step1Hint:`Three document classes make a complete CBAM dossier. Attach what is on the desk; nothing is uploaded anywhere — file names stay on this device.`,step1Title:`Attach the documents`,step2Hint:`Every field below appears in the final record. Nothing is saved until you verify them in step 3.`,step2Title:`Enter the fields`,step3Hint:`The same formulas as the declaration: mark-ups per year, the CBAM factor, exposure against the EU ,tipMass:`Your calendar-year total across all CBAM goods combined. Under 50 tonnes: no declaration — keep records only. Over the line: every tonne of the year becomes reportable. Electricity and hydrogen get no exemption and never count toward the line.`,toastExported:`File downloaded.`,toastNeedAll:`Verify every field before saving.`,toastSaved:`Record saved and verified.`,toastVerifiedPack:`Pack verified by the verifier.`,unverified:`Unverified`,verified:`Verified`,verifierCheck:`Verified by an EU-accredited verifier`,verify:`Verify`,verifyBad:`Signature invalid — the file was altered, or is not a Kaimeter pack`,verifyHow:`How this maps to the real world: verification is a regulated act, not a button. An EU-accredited verification body (accredited by a National Accreditation Body and listed in the EU CBAM Registry, per Delegated Reg (EU) 2025/2551) audits the dossier and issues a signed attestation — that attestation is what the importer's declaration relies on. Mark verified records exactly that act on the pack, and anyone can re-prove the seal offline with Verify a pack file.`,verifyLaterHint:`Verification is not self-declared: after this dossier is reviewed, an EU-accredited verifier marks the pack verified (Verifier role → Review).`,verifyNeedsCore:`Offline verification needs the Kaimeter core — open the served app (not file://).`,verifyOk:`Signature valid — pack intact`,verifyPackFileBtn:`Verify a pack file`,verifyStatus:`Verification`,whatIsCbam:`What is CBAM?`,whatsNext:`<b>What happens next — no bill arrives.</b> You buy CBAM certificates yourself, through the EU CBAM Registry (sales open 2027-02-01), and surrender them with one annual declaration — the first covers 2026 imports and is due 2027-09-30. Mills and traders never pay; they supply the data. The number above is an estimate — it moves with the carbon price when you buy and with your suppliers' verified data.`,wizTitle:`New consignment`,wizTitlePack:`New data pack`,year2026:`2026: +10%`,year2027:`2

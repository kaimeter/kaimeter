<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 100 100"
  width="100"
  height="100"
  role="img"
  aria-labelledby="kaimeter-logo-title"
>
  <title id="kaimeter-logo-title">Kaimeter</title>

  <!-- Presentation attributes are the baseline so the mark renders correctly
       even where a <style> block is stripped (email clients, some SVG
       sanitizers, older rasterizers). The block below only re-colours, so its
       removal degrades to the brand palette rather than to black. -->
  <style>
    .km-bg {
      fill: var(--primary, var(--kaimeter-primary, #2d3748));
    }
    .km-surface {
      fill: var(--surface, var(--kaimeter-surface, #ffffff));
    }
    .km-accent {
      fill: var(--accent, var(--kaimeter-accent, #38a169));
    }
    .km-ink {
      stroke: var(--primary, var(--kaimeter-primary, #2d3748));
    }
    .km-needle {
      stroke: var(--accent, var(--kaimeter-accent, #38a169));
    }
  </style>

  <!-- Meter face. The needle sits in the upper range: the mark is an
       instrument being read, which is the whole product. -->
  <rect x="24" y="24" width="52" height="52" rx="5" ry="5" fill="#2d3748" class="km-bg" />
  <circle cx="50" cy="50" r="22" fill="#ffffff" class="km-surface" />

  <!-- Dial rim, ticks and needle. -->
  <path
    d="M36 50a14 14 0 0 1 28 0"
    fill="none"
    stroke="#2d3748"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    class="km-ink"
  />
  <path
    d="m50 50 8-8"
    fill="none"
    stroke="#38a169"
    stroke-width="2.5"
    stroke-linecap="round"
    class="km-needle"
  />
  <path
    d="m38 44 2 2m8-6v2m12 2-2 2"
    fill="none"
    stroke="#2d3748"
    stroke-width="2.5"
    stroke-linecap="round"
    class="km-ink"
  />
  <circle cx="50" cy="50" r="3" fill="#38a169" class="km-accent" />
</svg>
